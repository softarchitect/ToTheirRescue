services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-to_their_rescue}
      - POSTGRES_USER=${POSTGRES_USER:-tyr_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tyr_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      # Required: configure these via environment or a .env file
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_EXPIRES_MIN=${JWT_ACCESS_EXPIRES_MIN:-30}
      - JWT_REFRESH_EXPIRES_DAYS=${JWT_REFRESH_EXPIRES_DAYS:-7}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - FLASK_APP=app:create_app
      # Run flask db migrate + flask db upgrade on container start
      - AUTO_MIGRATE=${AUTO_MIGRATE:-1}
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # Host port -> container port 80
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Used at build time so Next.js client code has the correct API URL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      # This should point to the public URL of your API
      # e.g. https://api.your-domain.com in production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
    ports:
      - "3003:3003"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    volumes:
      # Nginx config for Docker-based reverse proxy
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared volumes with Certbot for Let's Encrypt certificates
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # NOTE:
    #  - We intentionally DO NOT override entrypoint/command here.
    #  - This allows `docker compose run certbot ...` to correctly invoke
    #    the certbot CLI inside this image.

volumes:
  db-data:
  pgadmin-data:

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-to_their_rescue}
      # Do not provide insecure defaults in production.
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      # Required: configure these via environment or a .env file
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_EXPIRES_MIN=${JWT_ACCESS_EXPIRES_MIN:-30}
      - JWT_REFRESH_EXPIRES_DAYS=${JWT_REFRESH_EXPIRES_DAYS:-7}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - FLASK_APP=app:create_app
      # Run `flask db upgrade` on container start (safe for prod).
      - AUTO_MIGRATE=${AUTO_MIGRATE:-1}
      # Prod: do NOT auto-generate migrations on start.
      - AUTO_GENERATE_MIGRATIONS=${AUTO_GENERATE_MIGRATIONS:-0}
    # Intentionally NOT published in production.
    # nginx routes /api/* to this service over the Docker network.
    # If you must debug from the host, temporarily add:
    # ports:
    #   - "127.0.0.1:5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      # Run pgAdmin behind nginx on /pgadmin/ (HTTPS), not on a public host port.
      - PGADMIN_CONFIG_SCRIPT_NAME=/pgadmin
      - PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_FOR_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PROTO_COUNT=1
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Used at build time so Next.js client code has the correct API URL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      # This should point to the public URL of your API
      # e.g. https://api.your-domain.com in production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
    # Intentionally NOT published in production.
    # nginx routes / to this service over the Docker network.
    # If you must debug from the host, temporarily add:
    # ports:
    #   - "127.0.0.1:3003:3003"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    environment:
      # Used by nginx/entrypoint.sh to locate Let's Encrypt certs.
      - DOMAIN=${DOMAIN:-toyourrescue.org}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
      - pgadmin
    volumes:
      # Nginx config for Docker-based reverse proxy
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # pgAdmin basic auth credentials
      - ./nginx/security/pgadmin.htpasswd:/etc/nginx/security/pgadmin.htpasswd:ro
      # Shared volumes with Certbot for Let's Encrypt certificates
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles:
      # Prevent certbot from auto-starting on `docker compose up`.
      # Run it manually instead, e.g.:
      #   docker compose -f docker-compose-prod.yml run --rm certbot certonly ...
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # NOTE:
    #  - We intentionally DO NOT override entrypoint/command here.
    #  - This allows `docker compose run certbot ...` to correctly invoke
    #    the certbot CLI inside this image.

volumes:
  db-data:
  pgadmin-data:

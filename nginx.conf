#
# Nginx config for running to-their-rescue *inside Docker* as a reverse proxy.
#
# This file is mounted into the nginx container as:
#   /etc/nginx/conf.d/default.conf
#
# It assumes the following Docker services (see docker-compose-prod.yml):
#   - web: Next.js frontend on port 3003
#   - api: Flask API on port 5000
#

upstream to_their_rescue_web {
    # Docker service name and port for the Next.js app
    server web:3003;
}

upstream to_their_rescue_api {
    # Docker service name and port for the Flask API
    server api:5000;
}

##
## HTTP (port 80) – used for:
##   - Let's Encrypt HTTP-01 validation (/.well-known/acme-challenge/)
##   - Redirecting all normal traffic to HTTPS
##
server {
    listen 80;
    server_name toyourrescue.org www.toyourrescue.org;
    client_max_body_size 25m;

    # Let’s Encrypt HTTP-01 challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

##
## HTTPS (port 443) – main site
##
server {
    listen 443 ssl;
    server_name toyourrescue.org www.toyourrescue.org;
    client_max_body_size 25m;

    # TLS configuration is generated at container start:
    # - If Let's Encrypt certs exist under /etc/letsencrypt/live/<domain>/..., we use them.
    # - Otherwise we fall back to a temporary self-signed cert so nginx can start.
    include /etc/nginx/tls/ssl.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # All API requests go to Flask
    location /api/ {
        # NOTE: do NOT add a trailing slash here, so /api/... is preserved.
        proxy_pass http://to_their_rescue_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Next.js frontend
    location / {
        proxy_pass http://to_their_rescue_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Helpful for Next.js / WebSocket-style connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


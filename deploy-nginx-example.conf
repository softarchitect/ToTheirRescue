# Example Nginx configuration for to-their-rescue on a single EC2 instance
# with no custom domain.
#
# - Assumes Docker is exposing:
#     web (Next.js) on 127.0.0.1:3003
#     api (Flask) on 127.0.0.1:5000
# - Install this on your VPS under /etc/nginx/sites-available/ and symlink to sites-enabled
# - It is configured to serve:
#     http://54.226.98.185/                         -> Next.js frontend
#     http://54.226.98.185/api/...                  -> Flask API
#     http://ec2-54-163-55-101.compute-1.amazonaws.com/      -> Next.js frontend
#     http://ec2-54-163-55-101.compute-1.amazonaws.com/api/  -> Flask API

upstream to_their_rescue_web {
    server 127.0.0.1:3003;
}

upstream to_their_rescue_api {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    # Public IP and public DNS name of your EC2 instance
    server_name 54.226.98.185 ec2-54-163-55-101.compute-1.amazonaws.com;
    client_max_body_size 25m;

    # All API requests go to Flask
    location /api/ {
        # NOTE: do NOT add a trailing slash here, so /api/... is preserved.
        proxy_pass http://to_their_rescue_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Next.js frontend
    location / {
        proxy_pass http://to_their_rescue_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



